[workspace]
resolver = "2"
members = ["crates/common", "crates/token", "crates/factory", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
near-sys = "=0.4.0"
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"
swarmpad-common = { path = "crates/common" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = true
