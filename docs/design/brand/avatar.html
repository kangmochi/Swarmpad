<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swarmpad avatar</title>
    <style>
      @font-face {
        font-family: "Outfit Variable";
        src: url("../../../web/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2")
          format("woff2-variations");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrains Mono Variable";
        src: url("../../../web/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2-variations");
        font-weight: 100 800;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1000px; height: 1000px; }
      body {
        background:
          radial-gradient(80% 80% at 50% 12%, rgba(61, 217, 232, 0.22), transparent 62%),
          radial-gradient(60% 60% at 80% 90%, rgba(255, 79, 163, 0.2), transparent 60%),
          #140c2b;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .ring {
        position: absolute;
        inset: 90px;
        border-radius: 50%;
        border: 2px dashed rgba(61, 217, 232, 0.28);
      }
      .ring.two {
        inset: 150px;
        border-style: solid;
        border-color: rgba(255, 79, 163, 0.16);
      }
      img {
        width: 560px;
        height: 560px;
        filter: drop-shadow(0 30px 70px rgba(61, 217, 232, 0.28));
      }
      .mark {
        position: absolute;
        bottom: 86px;
        font-family: "Outfit Variable", sans-serif;
        font-weight: 700;
        font-size: 92px;
        letter-spacing: -0.04em;
        color: #f1ebd6;
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .mark span { color: #3dd9e8; }
      .tick {
        position: absolute;
        bottom: 44px;
        font-family: "JetBrains Mono Variable", monospace;
        font-size: 20px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(167, 159, 196, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="ring two"></div>
    <img src="../mascot/mascot-idle-1024.png" alt="" />
    <div class="mark">swarm<span>pad</span></div>
    <div class="tick">proof of work tokens</div>
  </body>
</html>
